<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Small Apps</title>
<meta name="description" content="A handful of small, self-contained tools. One page each, no accounts, no network.">
<meta name="apple-mobile-web-app-title" content="Small Apps">
<meta name="application-name" content="Small Apps">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Small Apps">
<meta property="og:title" content="Small Apps">
<meta property="og:description" content="A handful of small, self-contained tools. One page each, no accounts, no network.">
<meta property="og:url" content="https://joshboyden.github.io/">
<meta property="og:image" content="https://joshboyden.github.io/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Small Apps">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Small Apps">
<meta name="twitter:description" content="A handful of small, self-contained tools. One page each, no accounts, no network.">
<meta name="twitter:image" content="https://joshboyden.github.io/og.png">
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #14181e;
    --panel-2: #0e1217;
    --line: #262c35;
    --text: #f2f5f8;
    --muted: #98a3b2;
    --dim: #626d7c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }

  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.025em; margin: 0; }
  h1 span { display: block; color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 0; margin-top: 8px; }

  .apps { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }

  a.app {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; min-height: 92px; text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .1s ease;
  }
  a.app:active { transform: scale(.985); }

  .app .mark {
    flex: none; width: 60px; height: 60px; border-radius: 15px;
    background: var(--panel-2); border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden;
  }
  .app .mark svg { display: block; width: 100%; height: 100%; }

  .app .body { flex: 1; min-width: 0; }
  .app .nm { display: block; font-size: 18px; font-weight: 750; letter-spacing: -.015em; }
  .app .ds { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 4px; }
  .app .go { flex: none; color: var(--dim); font-size: 17px; padding-right: 4px; }

  footer { color: var(--dim); font-size: 12px; line-height: 1.7; margin-top: 30px; text-align: center; }
  footer code { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">

  <h1>Small Apps<span>Single-page tools. No accounts, no network, nothing leaves the device.</span></h1>

  <div class="apps" id="apps"></div>

  <footer>
    Each app is one self-contained HTML file in its own folder.<br>
    Add any of them to your home screen from the browser&rsquo;s share menu.
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* To add an app: drop its folder in the repo and add one entry here.
     `mark` is inline SVG on a 180-unit canvas, matching that app's own icon. */

  var APPS = [
    {
      name: 'Swingtime',
      href: 'swingtime/',
      desc: '40 seconds on, 20 off. A 15-exercise kettlebell circuit timer.',
      mark: '<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">' +
            '<rect width="180" height="180" fill="#0a0c0f"/>' +
            '<g transform="translate(0,-16)">' +
            '<path d="M 58 100 A 32 48 0 0 1 122 100 L 106 100 A 16 32 0 0 0 74 100 Z" fill="#2ee06a"/>' +
            '<circle cx="90" cy="130" r="36" fill="#2ee06a"/>' +
            '</g></svg>'
    },
    {
      name: 'Silver Falls',
      href: 'silverfalls/',
      desc: 'Nine-week training tracker for the Silver Falls trail half marathon.',
      mark: '<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">' +
            '<rect width="180" height="180" fill="#0b0d10"/>' +
            '<rect x="76" y="88" width="28" height="56" rx="4" fill="#eaf2fb"/>' +
            '<path d="M4 148 L56 36 L84 92 L84 148 Z" fill="#ff8a3d"/>' +
            '<path d="M176 148 L126 54 L96 92 L96 148 Z" fill="#dd6b1b"/>' +
            '<rect x="40" y="138" width="100" height="13" rx="6.5" fill="#eaf2fb"/>' +
            '</svg>'
    }
  ];

  document.getElementById('apps').innerHTML = APPS.map(function (a) {
    return '<a class="app" href="' + a.href + '">' +
      '<span class="mark">' + a.mark + '</span>' +
      '<span class="body">' +
        '<span class="nm">' + a.name + '</span>' +
        '<span class="ds">' + a.desc + '</span>' +
      '</span>' +
      '<span class="go">&rsaquo;</span>' +
    '</a>';
  }).join('');
})();
</script>
</body>
</html>
